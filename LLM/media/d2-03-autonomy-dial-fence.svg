<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-size="16" role="img" aria-labelledby="t d">
<title id="t">Autonomy dial and guard fence</title>
<desc id="d">On the left, a four-position dial runs from 1 ask first (green solid) through 2 suggest (blue dotted) and 3 act then tell (yellow) to 4 act alone (red-and-white stripes). The needle points at 2. On the right, a blue picket fence with a padlocked gate surrounds a small yard where a robot may read policy, draft a reply or ask a human. Outside the fence, in a striped zone, are actions that need a human: send money and delete files. A bottom strip says to turn the dial down for money, people and personal data.</desc>
<style>text{font-family:system-ui,"Segoe UI",Arial,sans-serif;fill:#1A1A1A;font-weight:700}.b{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:2}.k{stroke:#1A1A1A;stroke-width:2}</style>
<defs>
<pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFFFFF"/><rect width="6" height="12" fill="#D55E00"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#56B4E9"/><circle cx="5" cy="5" r="2.5" fill="#1A1A1A"/></pattern>
<pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F5F5F5"/><circle cx="6" cy="6" r="2.5" fill="#009E73"/></pattern>
</defs>
<rect width="800" height="450" fill="#F5F5F5"/>
<text x="400" y="30" text-anchor="middle" font-size="22" style="fill:#1A1A1A">Set the autonomy dial, then fence it with guards</text>
<rect class="b" x="60" y="52" width="220" height="30" rx="8"/><text x="170" y="73" text-anchor="middle">AUTONOMY DIAL</text>
<path d="M70 250 A100 100 0 0 1 99.3 179.3" fill="none" stroke="#009E73" stroke-width="34"/>
<path d="M99.3 179.3 A100 100 0 0 1 170 150" fill="none" stroke="url(#dots)" stroke-width="34"/>
<path d="M170 150 A100 100 0 0 1 240.7 179.3" fill="none" stroke="#F0E442" stroke-width="34"/>
<path d="M240.7 179.3 A100 100 0 0 1 270 250" fill="none" stroke="url(#stripe)" stroke-width="34"/>
<path d="M53 250 A117 117 0 0 1 287 250 M87 250 A83 83 0 0 1 253 250" fill="none" stroke="#1A1A1A" stroke-width="3"/>
<circle class="k" cx="78" cy="212" r="13" fill="#FFFFFF"/><text x="78" y="218" text-anchor="middle">1</text>
<circle class="k" cx="132" cy="158" r="13" fill="#FFFFFF"/><text x="132" y="164" text-anchor="middle">2</text>
<circle class="k" cx="208" cy="158" r="13" fill="#FFFFFF"/><text x="208" y="164" text-anchor="middle">3</text>
<circle class="k" cx="262" cy="212" r="13" fill="#FFFFFF"/><text x="262" y="218" text-anchor="middle">4</text>
<line x1="170" y1="250" x2="140" y2="182" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/><circle class="k" cx="170" cy="250" r="14" fill="#1A1A1A"/>
<rect class="b" x="30" y="274" width="300" height="28" rx="8"/><text x="44" y="294" font-size="15">1  ask first: a human approves</text>
<rect class="b" x="30" y="308" width="300" height="28" rx="8"/><text x="44" y="328" font-size="15">2  suggest: a human sends</text>
<rect class="b" x="30" y="342" width="300" height="28" rx="8"/><text x="44" y="362" font-size="15">3  act, then tell a human</text>
<rect class="b" x="30" y="376" width="300" height="28" rx="8"/><text x="44" y="396" font-size="15">4  act alone: rarely OK</text>
<rect class="b" x="430" y="52" width="262" height="30" rx="8"/><text x="561" y="73" text-anchor="middle">INSIDE the fence: allowed</text>
<rect class="k" x="430" y="92" width="232" height="190" fill="url(#grass)"/>
<rect x="430" y="92" width="232" height="190" fill="none" stroke="#0072B2" stroke-width="14" stroke-dasharray="12 6"/>
<rect x="430" y="92" width="232" height="190" fill="none" stroke="#1A1A1A" stroke-width="2"/>
<rect class="k" x="456" y="130" width="34" height="28" rx="6" fill="#56B4E9"/><circle cx="466" cy="142" r="3" fill="#1A1A1A"/><circle cx="480" cy="142" r="3" fill="#1A1A1A"/>
<line x1="473" y1="130" x2="473" y2="118" stroke="#1A1A1A" stroke-width="3"/><circle class="k" cx="473" cy="116" r="4" fill="#E69F00"/>
<rect class="k" x="451" y="162" width="44" height="52" rx="8" fill="#56B4E9"/>
<rect class="b" x="504" y="116" width="122" height="28" rx="8"/><text x="565" y="136" text-anchor="middle">read policy</text>
<rect class="b" x="504" y="154" width="122" height="28" rx="8"/><text x="565" y="174" text-anchor="middle">draft reply</text>
<rect class="b" x="504" y="192" width="122" height="28" rx="8"/><text x="565" y="212" text-anchor="middle">ask a human</text>
<rect class="k" x="640" y="226" width="28" height="48" fill="#F0E442"/>
<path d="M647 238 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#1A1A1A" stroke-width="3"/><rect class="k" x="644" y="238" width="20" height="16" rx="3" fill="#E69F00"/>
<rect class="k" x="430" y="300" width="350" height="94" fill="url(#stripe)"/>
<rect class="b" x="440" y="306" width="240" height="28" rx="8"/><text x="560" y="326" text-anchor="middle">OUTSIDE: needs a human</text>
<rect class="b" x="440" y="352" width="116" height="28" rx="8"/><text x="498" y="372" text-anchor="middle">send money</text>
<rect class="b" x="566" y="352" width="136" height="28" rx="8"/><text x="634" y="372" text-anchor="middle">delete files</text>
<rect class="k" x="130" y="414" width="540" height="28" rx="8" fill="#009E73"/><text x="400" y="434" text-anchor="middle">Turn the dial down for money, people and personal data</text>
</svg>
