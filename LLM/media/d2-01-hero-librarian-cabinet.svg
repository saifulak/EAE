<rect class="k" x="106" y="230" width="48" height="24" rx="4" fill="#FFFFFF"/><text x="130" y="248" text-anchor="middle" font-size="14">LIB</text>
<circle class="k" cx="130" cy="172" r="28" fill="#E69F00"/>
<path class="k" d="M102 168 A28 28 0 0 1 158 168 Q130 150 102 168Z" fill="#1A1A1A"/>
