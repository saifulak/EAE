<rect class="k" x="30" y="392" width="240" height="40" rx="10" fill="#E69F00"/><text x="150" y="418" text-anchor="middle">1  FIND the drawer</text>
<rect class="k" x="280" y="392" width="240" height="40" rx="10" fill="#56B4E9"/><text x="400" y="418" text-anchor="middle">2  QUOTE the card</text>
<rect class="k" x="530" y="392" width="240" height="40" rx="10" fill="#009E73"/><text x="650" y="418" text-anchor="middle">3  CITE its id</text>
