<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-size="16" role="img" aria-labelledby="t d">
<title id="t">The policy librarian: find the right drawer, quote the card, cite its id</title>
<desc id="d">A friendly librarian with round glasses and a purple cardigan, at the Seri Maju Policy Desk, hears the question "How much for meals?". She points at a blue filing cabinet whose drawers are labelled with chunk ids such as sm-pol-03#1. The top drawer is pulled out and a card pops up reading Meals RM 60/day. An answer bubble says RM 60 a day with the citation sm-pol-03#1. A second note says that if nothing matches, say not found. A bottom strip lists three steps: find the drawer, quote the card, cite its id.</desc>
<style>text{font-family:system-ui,"Segoe UI",Arial,sans-serif;fill:#1A1A1A;font-weight:700}.b{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:2}.k{stroke:#1A1A1A;stroke-width:2}</style>
