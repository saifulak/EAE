<rect class="k" x="372" y="62" width="190" height="64" rx="6" fill="#FFFFFF"/><text x="467" y="90" text-anchor="middle" font-size="14">card in drawer</text><text x="467" y="114" text-anchor="middle">Meals RM 60/day</text>
<rect class="k" x="320" y="190" width="170" height="46" rx="4" fill="#FFFFFF"/><rect class="b" x="334" y="198" width="124" height="24"/><text x="396" y="216" text-anchor="middle" font-size="14">sm-pol-03#2</text><rect x="390" y="228" width="30" height="5" fill="#1A1A1A"/>
