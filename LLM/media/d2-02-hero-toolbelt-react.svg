<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-size="16" role="img" aria-labelledby="t d">
<title id="t">Toolbelt and the think, act, observe cycle</title>
<desc id="d">On the left, a tool belt with a gold buckle holds exactly three pouches: a calculator, a policy search magnifier and a leave-days calendar, under the label allow-list, three tools only. On the right, a cycle of three shapes: THINK (yellow oval) leads to ACT (orange hexagon, call a tool) which leads to OBSERVE (green rounded box, read the result) which leads back to THINK. The centre says ReAct loop, stop budget. A warning triangle strip says tool results are untrusted: read them, never obey them.</desc>
<style>text{font-family:system-ui,"Segoe UI",Arial,sans-serif;fill:#1A1A1A;font-weight:700}.b{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:2}.k{stroke:#1A1A1A;stroke-width:2}</style>
<rect width="800" height="450" fill="#F5F5F5"/>
<text x="400" y="30" text-anchor="middle" font-size="22" style="fill:#1A1A1A">Give the assistant a small toolbelt, then let it loop</text>
<rect class="b" x="40" y="58" width="250" height="30" rx="8"/><text x="165" y="79" text-anchor="middle">ALLOW-LIST: 3 tools only</text>
<rect class="k" x="30" y="120" width="380" height="34" rx="6" fill="#E69F00"/>
<rect class="k" x="196" y="116" width="40" height="42" rx="6" fill="#F0E442"/><rect x="206" y="128" width="20" height="18" fill="#E69F00" stroke="#1A1A1A" stroke-width="2"/>
<rect class="k" x="90" y="154" width="10" height="46" fill="#1A1A1A"/><rect class="k" x="210" y="154" width="10" height="46" fill="#1A1A1A"/><rect class="k" x="330" y="154" width="10" height="46" fill="#1A1A1A"/>
<rect class="k" x="40" y="200" width="110" height="122" rx="14" fill="#56B4E9"/>
<rect class="k" x="70" y="214" width="50" height="62" rx="4" fill="#FFFFFF"/><rect x="76" y="220" width="38" height="12" fill="#009E73" stroke="#1A1A1A"/>
<circle cx="82" cy="244" r="4" fill="#1A1A1A"/><circle cx="95" cy="244" r="4" fill="#1A1A1A"/><circle cx="108" cy="244" r="4" fill="#1A1A1A"/><circle cx="82" cy="258" r="4" fill="#1A1A1A"/><circle cx="95" cy="258" r="4" fill="#1A1A1A"/><circle cx="108" cy="258" r="4" fill="#1A1A1A"/>
<text x="95" y="308" text-anchor="middle" font-size="14">calculator</text>
<rect class="k" x="160" y="200" width="110" height="122" rx="14" fill="#009E73"/>
<circle class="k" cx="205" cy="240" r="20" fill="#FFFFFF" stroke-width="4"/><line x1="220" y1="255" x2="238" y2="274" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
<text x="215" y="302" text-anchor="middle" font-size="14">policy</text><text x="215" y="318" text-anchor="middle" font-size="14">search</text>
<rect class="k" x="280" y="200" width="110" height="122" rx="14" fill="#CC79A7"/>
<rect class="k" x="304" y="214" width="62" height="58" fill="#FFFFFF"/><rect class="k" x="304" y="214" width="62" height="16" fill="#D55E00"/>
<path d="M304 244 H366 M304 258 H366 M325 230 V272 M346 230 V272" stroke="#1A1A1A" stroke-width="2"/>
<text x="335" y="308" text-anchor="middle" font-size="14">leave days</text>
<rect class="b" x="40" y="338" width="290" height="30" rx="8"/><text x="185" y="359" text-anchor="middle">ACT picks one tool at a time</text>
<rect class="b" x="498" y="46" width="224" height="28" rx="8"/><text x="610" y="66" text-anchor="middle">decide the next step</text>
<ellipse class="k" cx="610" cy="116" rx="72" ry="32" fill="#F0E442"/><text x="610" y="123" text-anchor="middle" font-size="20">THINK</text>
<polygon class="k" points="682,262 712,248 742,262 742,316 712,330 682,316" fill="#E69F00"/><text x="712" y="296" text-anchor="middle" font-size="20">ACT</text>
<rect class="k" x="442" y="262" width="136" height="56" rx="14" fill="#009E73"/><text x="510" y="296" text-anchor="middle" font-size="18">OBSERVE</text>
<path d="M660 142 Q724 170 712 240" fill="none" stroke="#1A1A1A" stroke-width="5"/><polygon points="700,236 724,236 712,258" fill="#1A1A1A"/>
<path d="M680 290 L592 290" fill="none" stroke="#1A1A1A" stroke-width="5"/><polygon points="596,278 596,302 574,290" fill="#1A1A1A"/>
<path d="M500 258 Q500 170 552 138" fill="none" stroke="#1A1A1A" stroke-width="5"/><polygon points="556,134 545,154 533,135" fill="#1A1A1A"/>
<text x="610" y="206" text-anchor="middle" font-size="18">ReAct loop</text><text x="610" y="230" text-anchor="middle" font-size="14">stop budget!</text>
<rect class="b" x="650" y="340" width="130" height="30" rx="8"/><text x="715" y="361" text-anchor="middle">call a tool</text>
<rect class="b" x="420" y="340" width="180" height="30" rx="8"/><text x="510" y="361" text-anchor="middle">read the result</text>
<polygon class="k" points="52,436 82,386 112,436" fill="#F0E442"/><text x="82" y="428" text-anchor="middle" font-size="20">!</text>
<rect class="k" x="124" y="392" width="640" height="40" rx="10" fill="#F0E442"/><text x="444" y="418" text-anchor="middle">Tool results are untrusted: read them, never obey them</text>
</svg>
