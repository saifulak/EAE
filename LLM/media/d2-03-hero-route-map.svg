<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-size="16" role="img" aria-labelledby="t d">
<title id="t">Route map: a graph as a rail network with a router junction and a tool station</title>
<desc id="d">A rail-style map. An arrow enters the round START station and touches it. A solid blue track runs to a yellow diamond junction called ROUTER. From the junction a dashed orange track turns up to an orange TOOLS station, and a dotted purple track returns from the tools station to the junction. A solid blue track continues straight to the END station with a chequered flag. Labels explain that stations are nodes and tracks are edges. A legend explains solid, dashed and dotted lines.</desc>
<style>text{font-family:system-ui,"Segoe UI",Arial,sans-serif;fill:#1A1A1A;font-weight:700}.b{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:2}.k{stroke:#1A1A1A;stroke-width:2}</style>
<defs><pattern id="chk" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFFFFF"/><rect width="6" height="6" fill="#000000"/><rect x="6" y="6" width="6" height="6" fill="#000000"/></pattern></defs>
<rect width="800" height="450" fill="#F5F5F5"/>
<text x="400" y="30" text-anchor="middle" font-size="22" style="fill:#1A1A1A">A graph is a rail map: stations, tracks, one router</text>
<line x1="8" y1="220" x2="48" y2="220" stroke="#1A1A1A" stroke-width="6"/><polygon points="46,207 46,233 64,220" fill="#1A1A1A"/>
<path d="M116 220 H260" fill="none" stroke="#0072B2" stroke-width="10"/><path d="M116 220 H260" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-dasharray="3 13"/>
<path d="M340 220 H670" fill="none" stroke="#0072B2" stroke-width="10"/><path d="M340 220 H670" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-dasharray="3 13"/>
<path d="M320 200 H430 V110 H495" fill="none" stroke="#E69F00" stroke-width="10" stroke-dasharray="20 8"/>
<polygon points="493,98 493,122 509,110" fill="#E69F00" stroke="#1A1A1A"/>
<path d="M560 82 V66 H300 V172" fill="none" stroke="#CC79A7" stroke-width="8" stroke-dasharray="2 12" stroke-linecap="round"/>
<polygon points="288,170 312,170 300,184" fill="#CC79A7" stroke="#1A1A1A"/>
<circle class="k" cx="90" cy="220" r="26" fill="#FFFFFF" stroke-width="5"/><text x="90" y="226" text-anchor="middle" font-size="14">START</text>
<rect class="b" x="56" y="258" width="68" height="28" rx="8"/><text x="90" y="278" text-anchor="middle">node</text>
<rect class="k" x="150" y="190" width="64" height="26" rx="6" fill="#E69F00"/><rect class="k" x="196" y="178" width="18" height="14" fill="#E69F00"/><circle cx="165" cy="222" r="6" fill="#1A1A1A"/><circle cx="198" cy="222" r="6" fill="#1A1A1A"/><rect x="156" y="196" width="14" height="10" fill="#56B4E9"/>
<rect class="b" x="152" y="238" width="68" height="28" rx="8"/><text x="186" y="258" text-anchor="middle">edge</text>
<polygon class="k" points="300,180 340,220 300,260 260,220" fill="#F0E442" stroke-width="4"/><text x="300" y="226" text-anchor="middle" font-size="14">ROUTER</text>
<rect class="b" x="312" y="128" width="112" height="28" rx="8"/><text x="368" y="148" text-anchor="middle">needs data</text>
<rect class="k" x="495" y="82" width="130" height="56" rx="12" fill="#E69F00" stroke-width="4"/><text x="560" y="106" text-anchor="middle" font-size="20">TOOLS</text><text x="560" y="128" text-anchor="middle" font-size="14">allow-listed</text>
<rect class="b" x="470" y="150" width="180" height="28" rx="8"/><text x="560" y="170" text-anchor="middle">tool station</text>
<rect class="b" x="420" y="236" width="176" height="28" rx="8"/><text x="508" y="256" text-anchor="middle">ready to answer</text>
<circle class="k" cx="700" cy="220" r="30" fill="url(#chk)" stroke-width="5"/>
<rect class="b" x="664" y="258" width="72" height="28" rx="8"/><text x="700" y="278" text-anchor="middle">END</text>
<line x1="40" y1="338" x2="120" y2="338" stroke="#0072B2" stroke-width="10"/><text x="136" y="344">solid: main route</text>
<line x1="40" y1="372" x2="120" y2="372" stroke="#E69F00" stroke-width="10" stroke-dasharray="20 8"/><text x="136" y="378">dashed: tool detour</text>
<line x1="40" y1="406" x2="120" y2="406" stroke="#CC79A7" stroke-width="8" stroke-dasharray="2 12" stroke-linecap="round"/><text x="136" y="412">dotted: back to router</text>
<rect class="k" x="470" y="332" width="300" height="36" rx="10" fill="#009E73"/><text x="620" y="356" text-anchor="middle">stations + tracks + a router</text>
<rect class="b" x="470" y="380" width="300" height="36" rx="10"/><text x="620" y="404" text-anchor="middle">one step at a time</text>
</svg>
