<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-size="16" role="img" aria-labelledby="t d">
<title id="t">Supervisor or relay: who is in charge of the agents?</title>
<desc id="d">Two panels. Left, SUPERVISOR: one manager with a clipboard in the middle sends tasks along solid lines to three workers named Policy, Math and Leave and gets results back. Caption: clear route, easy to follow. Right, RELAY: three runners in lanes pass a striped baton from one to the next along dashed arcs labelled hand-off. Caption: flexible, but harder to trace. A bottom strip advises starting with the supervisor because it is easier to check.</desc>
<style>text{font-family:system-ui,"Segoe UI",Arial,sans-serif;fill:#1A1A1A;font-weight:700}.b{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:2}.k{stroke:#1A1A1A;stroke-width:2}</style>
<defs><pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#F0E442"/><rect width="5" height="10" fill="#1A1A1A"/></pattern></defs>
<rect width="800" height="450" fill="#F5F5F5"/>
<text x="400" y="30" text-anchor="middle" font-size="22" style="fill:#1A1A1A">Who is in charge? A supervisor or a relay</text>
<rect class="b" x="20" y="46" width="370" height="306" rx="14"/><rect class="b" x="410" y="46" width="370" height="306" rx="14"/>
<text x="205" y="78" text-anchor="middle" font-size="20">SUPERVISOR</text>
<rect class="k" x="182" y="140" width="46" height="46" rx="12" fill="#0072B2"/><circle class="k" cx="205" cy="120" r="20" fill="#E69F00"/>
<rect class="k" x="232" y="148" width="24" height="32" fill="#F0E442"/><path d="M237 158 H251 M237 166 H251 M237 174 H251" stroke="#1A1A1A" stroke-width="2"/>
<line x1="190" y1="188" x2="98" y2="212" stroke="#1A1A1A" stroke-width="4"/><polygon points="88,222 94,204 106,214" fill="#1A1A1A"/>
<line x1="205" y1="188" x2="205" y2="212" stroke="#1A1A1A" stroke-width="4"/><polygon points="195,210 215,210 205,224" fill="#1A1A1A"/>
<line x1="220" y1="188" x2="312" y2="212" stroke="#1A1A1A" stroke-width="4"/><polygon points="322,222 304,214 316,204" fill="#1A1A1A"/>
<circle class="k" cx="90" cy="240" r="16" fill="#E69F00"/><rect class="k" x="72" y="258" width="36" height="32" rx="8" fill="#56B4E9"/><text x="90" y="316" text-anchor="middle" font-size="14">Policy</text>
<circle class="k" cx="205" cy="240" r="16" fill="#E69F00"/><rect class="k" x="187" y="258" width="36" height="32" rx="8" fill="#009E73"/><text x="205" y="316" text-anchor="middle" font-size="14">Math</text>
<circle class="k" cx="320" cy="240" r="16" fill="#E69F00"/><rect class="k" x="302" y="258" width="36" height="32" rx="8" fill="#CC79A7"/><text x="320" y="316" text-anchor="middle" font-size="14">Leave</text>
<text x="595" y="78" text-anchor="middle" font-size="20">RELAY</text>
<rect class="b" x="540" y="92" width="110" height="26" rx="8"/><text x="595" y="111" text-anchor="middle" font-size="14">hand-off</text>
<path d="M480 170 Q538 114 590 168" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-dasharray="10 6"/><polygon points="580,156 600,172 578,176" fill="#1A1A1A"/>
<path d="M605 170 Q662 114 715 168" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-dasharray="10 6"/><polygon points="705,156 725,172 703,176" fill="#1A1A1A"/>
<circle class="k" cx="470" cy="196" r="16" fill="#E69F00"/><rect class="k" x="454" y="214" width="32" height="38" rx="10" fill="#56B4E9"/><path d="M458 252 L446 276 M482 252 L496 272" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
<line x1="486" y1="226" x2="530" y2="220" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/><rect class="k" x="528" y="212" width="40" height="12" fill="url(#stripe)"/>
<circle class="k" cx="595" cy="196" r="16" fill="#E69F00"/><rect class="k" x="579" y="214" width="32" height="38" rx="10" fill="#009E73"/><path d="M583 252 L571 276 M607 252 L621 272" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
<line x1="611" y1="226" x2="655" y2="220" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/><rect class="k" x="653" y="212" width="40" height="12" fill="url(#stripe)"/>
<circle class="k" cx="720" cy="196" r="16" fill="#E69F00"/><rect class="k" x="704" y="214" width="32" height="38" rx="10" fill="#CC79A7"/><path d="M708 252 L696 276 M732 252 L746 272" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
<line x1="430" y1="288" x2="760" y2="288" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="12 8"/>
<text x="470" y="316" text-anchor="middle" font-size="14">Policy</text><text x="595" y="316" text-anchor="middle" font-size="14">Math</text><text x="720" y="316" text-anchor="middle" font-size="14">Leave</text>
<rect class="b" x="60" y="362" width="290" height="30" rx="8"/><text x="205" y="383" text-anchor="middle">Clear route, easy to follow</text>
<rect class="b" x="450" y="362" width="290" height="30" rx="8"/><text x="595" y="383" text-anchor="middle" font-size="15">Flexible, but harder to trace</text>
<rect class="k" x="150" y="404" width="500" height="36" rx="10" fill="#009E73"/><text x="400" y="428" text-anchor="middle">Start with the supervisor: it is easier to check</text>
</svg>
