<line x1="392" y1="215" x2="369" y2="182" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/><circle cx="392" cy="215" r="7" fill="#1A1A1A"/>
<text x="392" y="246" text-anchor="middle" font-size="14">uses sources</text>
