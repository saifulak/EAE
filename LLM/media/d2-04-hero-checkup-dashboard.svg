<rect class="k" x="114" y="68" width="52" height="38" rx="6" fill="#F0E442"/><text x="140" y="93" text-anchor="middle">Q2</text>
<rect class="k" x="188" y="60" width="52" height="38" rx="6" fill="#CC79A7"/><text x="214" y="85" text-anchor="middle">Q3</text>
<polygon class="k" points="30,116 250,116 176,250 104,250" fill="#E69F00" stroke-width="3"/>
<text x="140" y="170" text-anchor="middle">golden set</text>
