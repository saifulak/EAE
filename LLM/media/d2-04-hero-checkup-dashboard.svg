<line x1="140" y1="300" x2="288" y2="300" stroke="#1A1A1A" stroke-width="28"/><line x1="140" y1="300" x2="288" y2="300" stroke="#56B4E9" stroke-width="20"/>
<polygon class="k" points="284,282 284,318 306,300" fill="#1A1A1A"/>
<rect class="b" x="20" y="332" width="256" height="30" rx="8"/><text x="148" y="353" text-anchor="middle">every run, same questions</text>
<rect class="k" x="310" y="60" width="466" height="300" rx="16" fill="#1A1A1A"/><rect x="322" y="72" width="442" height="276" rx="8" fill="#F5F5F5"/>
<rect class="k" x="500" y="360" width="90" height="16" fill="#1A1A1A"/><rect class="k" x="450" y="376" width="190" height="10" rx="5" fill="#1A1A1A"/>
<polyline points="334,106 356,106 364,92 374,120 382,100 390,106 410,106" fill="none" stroke="#D55E00" stroke-width="4" stroke-linejoin="round"/>
<text x="590" y="112" text-anchor="middle" font-size="18">CHECK-UP DASHBOARD</text>
