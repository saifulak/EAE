<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-size="16" role="img" aria-labelledby="t d">
<title id="t">Check-up dashboard: a funnel of test questions feeds three dials</title>
<desc id="d">Three question cards, Q1 to Q3, drop into an orange funnel labelled golden set. A blue pipe carries them into a computer monitor titled check-up dashboard, with a heartbeat line. The monitor shows three plain dials with needles, labelled uses sources, cites ids and says not found, a small bar chart called over time with five bars, and a yellow sticky note saying look at what went wrong first. No target number is shown: the dashboard only shows what to fix next.</desc>
<style>text{font-family:system-ui,"Segoe UI",Arial,sans-serif;fill:#1A1A1A;font-weight:700}.b{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:2}.k{stroke:#1A1A1A;stroke-width:2}</style>
<rect width="800" height="450" fill="#F5F5F5"/>
<text x="400" y="30" text-anchor="middle" font-size="22" style="fill:#1A1A1A">A check-up for your assistant: look, learn, fix</text>
